            if (isRotating && selectedObject && selectedObject !== 'ballSpawn') {
                const dx = pos.x - selectedObject.x;
                const dy = pos.y - selectedObject.y;
                // Calculate rotation so handle follows mouse and object rotates with it
                selectedObject.rotation = Math.atan2(dx, -dy) * 180 / Math.PI;
                return;
            }

            if (isResizing && selectedObject && selectedObject !== 'ballSpawn') {
                const dx = pos.x - dragStart.x;
                const dy = pos.y - dragStart.y;

                if (selectedObject.type === 'circle') {
                    const delta = (dx + dy) / 2;
                    selectedObject.radius = Math.max(15, selectedObject.radius + delta);
                    selectedObject.width = selectedObject.radius * 2;
                    selectedObject.height = selectedObject.radius * 2;
                } else {
                    if (resizeHandle.includes('right')) selectedObject.width = Math.max(20, selectedObject.width + dx);
                    if (resizeHandle.includes('left')) { selectedObject.width = Math.max(20, selectedObject.width - dx); selectedObject.x += dx/2; }
                    if (resizeHandle.includes('bottom')) selectedObject.height = Math.max(10, selectedObject.height + dy);
                    if (resizeHandle.includes('top')) { selectedObject.height = Math.max(10, selectedObject.height - dy); selectedObject.y += dy/2; }
                }
                dragStart = pos;
                return;
            }

            if (isDragging && selectedObject) {
                if (selectedObject === 'ballSpawn') {
                    currentLevel.ballSpawn.x = pos.x;
                    currentLevel.ballSpawn.y = pos.y;
                    ball = new Ball(pos.x, pos.y);
                } else if (selectedObject.type === 'wall') {
                    const dx = pos.x - dragStart.x;
                    const dy = pos.y - dragStart.y;
                    selectedObject.x1 += dx;
                    selectedObject.y1 += dy;
                    selectedObject.x2 += dx;
                    selectedObject.y2 += dy;
                    selectedObject.x += dx;
                    selectedObject.y += dy;
                    dragStart = pos;
                } else {
                    const oldX = selectedObject.x;
                    const oldY = selectedObject.y;
                    selectedObject.x = pos.x;
                    selectedObject.y = pos.y;

                    if (wouldOverlap(selectedObject)) {
                        selectedObject.x = oldX;
                        selectedObject.y = oldY;
                    }
                }
            }
        }

        function onEditorMouseUp(e) {
            if (isEditorPanning) {
                isEditorPanning = false;
                return;
            }

            if (isDrawingWall && wallStartPoint) {
                const screenPos = getMousePos(editorCanvas, e);
                const pos = screenToWorldEditor(screenPos);
                const dist = Math.sqrt((pos.x - wallStartPoint.x)**2 + (pos.y - wallStartPoint.y)**2);
                if (dist > 20) {
                    const wall = new Wall(wallStartPoint.x, wallStartPoint.y, pos.x, pos.y);
                    const walls = currentLevel.objects.filter(o => o.type === 'wall');
                    wall.snapToNearbyWalls(walls);
                    currentLevel.objects.push(wall);
                    selectedObject = wall;
                }
            }

            isDragging = false;
            isResizing = false;
            isRotating = false;
            isDrawingWall = false;
            wallStartPoint = null;
            resizeHandle = null;
        }

        function onEditorWheel(e) {
            e.preventDefault();

            // If object is selected, resize it
            if (selectedObject && selectedObject !== 'ballSpawn' && selectedObject.type !== 'wall') {
                const delta = e.deltaY > 0 ? -5 : 5;
                if (selectedObject.type === 'circle') {
                    selectedObject.radius = Math.max(15, selectedObject.radius + delta);
                    selectedObject.width = selectedObject.radius * 2;
                    selectedObject.height = selectedObject.radius * 2;
                } else {
                    selectedObject.width = Math.max(20, selectedObject.width + delta);
                    selectedObject.height = Math.max(10, selectedObject.height + delta * 0.3);
                }
            } else {
                // No object selected - zoom camera
                const zoomFactor = e.deltaY > 0 ? 0.9 : 1.1;
                const screenPos = getMousePos(editorCanvas, e);

                // Zoom towards mouse position
                const worldX = (screenPos.x - editorCameraX) / editorCameraZoom;
                const worldY = (screenPos.y - editorCameraY) / editorCameraZoom;

                editorCameraZoom *= zoomFactor;
                editorCameraZoom = Math.max(0.25, Math.min(3, editorCameraZoom));

                editorCameraX = screenPos.x - worldX * editorCameraZoom;
                editorCameraY = screenPos.y - worldY * editorCameraZoom;
            }
        }

        function onKeyDown(e) {
            if (currentState === GameState.EDITING && selectedObject && selectedObject !== 'ballSpawn') {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    const index = currentLevel.objects.indexOf(selectedObject);
                    if (index > -1) {
                        currentLevel.objects.splice(index, 1);
                        selectedObject = null;
                    }
                }
            }
            if (e.key === 'Escape') {
                closeSettings();
                document.getElementById('winModal').classList.remove('active');
            }
        }

        function getResizeHandles(obj) {
            const hw = obj.width / 2;
            const hh = obj.height / 2;
            const rad = obj.rotation * Math.PI / 180;
            const cos = Math.cos(rad);
            const sin = Math.sin(rad);

            // Helper to rotate a point around (0,0) then translate to object position
            const rotatePoint = (lx, ly) => ({
                x: obj.x + lx * cos - ly * sin,
                y: obj.y + lx * sin + ly * cos
            });

            return {
                'top': rotatePoint(0, -hh),
                'bottom': rotatePoint(0, hh),
                'left': rotatePoint(-hw, 0),
                'right': rotatePoint(hw, 0),
                'top-left': rotatePoint(-hw, -hh),
                'top-right': rotatePoint(hw, -hh),
                'bottom-left': rotatePoint(-hw, hh),
                'bottom-right': rotatePoint(hw, hh)
            };
        }

        function wouldOverlap(obj) {
            for (const other of currentLevel.objects) {
                if (other === obj) continue;
                if (obj.overlaps && obj.overlaps(other)) return true;
            }
            return false;
        }

        function autoOrientSpike(spike, canvas, objects) {
            const threshold = 60; // Distance to consider "near" a surface
            let nearestDist = Infinity;
            let targetRotation = 0;

            // Check distance to floor (using fixed FLOOR_Y)
            const distToFloor = FLOOR_Y - spike.y;
            if (distToFloor < threshold && distToFloor > 0 && distToFloor < nearestDist) {
                nearestDist = distToFloor;
                targetRotation = 0; // Point up
                spike.y = FLOOR_Y - spike.height / 2;
            }

            // Check distance to Wall objects
            objects.forEach(obj => {
                if (obj.type !== 'wall') return;

                // Find closest point on wall line to spike
                const dx = obj.x2 - obj.x1;
                const dy = obj.y2 - obj.y1;
                const len = Math.sqrt(dx * dx + dy * dy);
                if (len === 0) return;

                const t = Math.max(0, Math.min(1, ((spike.x - obj.x1) * dx + (spike.y - obj.y1) * dy) / (len * len)));
                const closestX = obj.x1 + t * dx;
                const closestY = obj.y1 + t * dy;
                const distToWall = Math.sqrt((spike.x - closestX) ** 2 + (spike.y - closestY) ** 2);

                if (distToWall < threshold && distToWall < nearestDist) {
                    nearestDist = distToWall;

                    // Calculate wall normal (perpendicular direction)
                    const wallAngle = Math.atan2(dy, dx);
                    // Normal is perpendicular to wall
                    let normalAngle = wallAngle - Math.PI / 2;

                    // Determine which side of the wall the spike is on
                    const spikeToWallX = spike.x - closestX;
                    const spikeToWallY = spike.y - closestY;
                    const normalX = Math.cos(normalAngle);
                    const normalY = Math.sin(normalAngle);
                    const dotProduct = spikeToWallX * normalX + spikeToWallY * normalY;

                    // If spike is on the other side, flip the normal
                    if (dotProduct < 0) {
                        normalAngle += Math.PI;
                    }

                    // Convert to spike rotation (spike points up at rotation 0)
                    // So we need to rotate from "up" to the normal direction
                    targetRotation = (normalAngle * 180 / Math.PI) + 90;

                    // Snap spike base to wall
                    spike.x = closestX + Math.cos(normalAngle) * (spike.height / 2);
                    spike.y = closestY + Math.sin(normalAngle) * (spike.height / 2);
                }
            });

            spike.rotation = targetRotation;
        }

        // ==================== GAME LOOP ====================
        function gameLoop() {
            if (currentState === GameState.PLAYING) {
                updateGame();
                renderGame();
            } else if (currentState === GameState.EDITING) {
                renderEditor();
            }
            requestAnimationFrame(gameLoop);
        }

        function updateGame() {
            if (ball && !ball.isDead) {
                ball.update(gameCanvas, currentLevel.objects);
            }
        }

        function renderGame() {
            const ctx = gameCtx;
            const canvas = gameCanvas;

            // Clear with background
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Apply camera transform
            ctx.save();
            ctx.translate(cameraX, cameraY);
            ctx.scale(cameraZoom, cameraZoom);

            // Floor (infinite in world space)
            // Calculate visible area in world coordinates
            const visibleLeft = -cameraX / cameraZoom - 1000;
            const visibleRight = (canvas.width - cameraX) / cameraZoom + 1000;

            ctx.fillStyle = '#2a2a4a';
            ctx.fillRect(visibleLeft, FLOOR_Y, visibleRight - visibleLeft, 2000);
            ctx.strokeStyle = '#3a3a5a';
            ctx.lineWidth = 2 / cameraZoom;
            ctx.beginPath();
            ctx.moveTo(visibleLeft, FLOOR_Y);
            ctx.lineTo(visibleRight, FLOOR_Y);
            ctx.stroke();

            // Draw objects
            currentLevel.objects.forEach(obj => obj.draw(ctx));

            // Draw ball
            if (ball) {
                ball.draw(ctx);

                // Draw last launch path hint when ball is ready to be launched (stays visible while aiming)
                if (!ball.isLaunched && (lastLaunchVx !== 0 || lastLaunchVy !== 0)) {
                    ctx.strokeStyle = 'rgba(255, 200, 100, 0.4)';
                    ctx.setLineDash([4 / cameraZoom, 4 / cameraZoom]);
                    ctx.lineWidth = 2 / cameraZoom;
                    ctx.beginPath();

                    let px = ball.x, py = ball.y, pvx = lastLaunchVx, pvy = lastLaunchVy;
                    ctx.moveTo(px, py);

                    // Draw a shorter path (30 steps) as a hint
                    for (let i = 0; i < 30; i++) {
                        pvy += currentLevel.gravity;
                        px += pvx;
                        py += pvy;
                        if (py > FLOOR_Y - ball.radius) {
                            py = FLOOR_Y - ball.radius;
                            pvy = -pvy * currentLevel.bounciness;
                        }
                        ctx.lineTo(px, py);
                    }

                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Draw a small label
                    ctx.fillStyle = 'rgba(255, 200, 100, 0.6)';
                    ctx.font = `${12 / cameraZoom}px Arial`;
                    ctx.fillText('Last shot', ball.x + 25, ball.y - 15);
                }

                if (isLaunching && !ball.isLaunched) {
                    // Cap the visual line at max power distance (200 pixels)
                    const maxPullDist = 200;
                    const lineDx = lastMouseX - ball.x;
                    const lineDy = lastMouseY - ball.y;
                    const lineDist = Math.sqrt(lineDx * lineDx + lineDy * lineDy);

                    let lineEndX = lastMouseX;
                    let lineEndY = lastMouseY;
                    if (lineDist > maxPullDist) {
                        const scale = maxPullDist / lineDist;
                        lineEndX = ball.x + lineDx * scale;
                        lineEndY = ball.y + lineDy * scale;
                    }

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                    ctx.lineWidth = 2 / cameraZoom;
                    ctx.beginPath();
                    ctx.moveTo(ball.x, ball.y);
                    ctx.lineTo(lineEndX, lineEndY);
                    ctx.stroke();

                    const dx = launchStart.x - lastMouseX;
                    const dy = launchStart.y - lastMouseY;
                    const power = Math.min(Math.sqrt(dx*dx + dy*dy) / 10, 20);
                    const angle = Math.atan2(dy, dx);
                    const vx = Math.cos(angle) * power;
                    const vy = Math.sin(angle) * power;

                    ctx.strokeStyle = 'rgba(0, 217, 255, 0.6)';
                    ctx.setLineDash([5 / cameraZoom, 5 / cameraZoom]);
                    ctx.beginPath();

                    let px = ball.x, py = ball.y, pvx = vx, pvy = vy;
                    ctx.moveTo(px, py);

                    for (let i = 0; i < 60; i++) {
                        pvy += currentLevel.gravity;
                        px += pvx;
                        py += pvy;
                        if (py > FLOOR_Y - ball.radius) {
                            py = FLOOR_Y - ball.radius;
                            pvy = -pvy * currentLevel.bounciness;
                        }
                        ctx.lineTo(px, py);
                    }

                    ctx.stroke();
                    ctx.setLineDash([]);

                    ctx.fillStyle = '#00d9ff';
                    ctx.font = `${16 / cameraZoom}px Arial`;
                    ctx.fillText(`Power: ${Math.round(power * 5)}%`, ball.x + 30, ball.y - 30);
                }
            }

            ctx.restore();

            // Draw zoom indicator (UI, not affected by camera)
            if (cameraZoom !== 1) {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '14px Arial';
                ctx.fillText(`Zoom: ${Math.round(cameraZoom * 100)}%`, 10, canvas.height - 40);
            }
        }

        function renderEditor() {
            const ctx = editorCtx;
            const canvas = editorCanvas;

            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Apply camera transform
            ctx.save();
            ctx.translate(editorCameraX, editorCameraY);
            ctx.scale(editorCameraZoom, editorCameraZoom);

            // Calculate visible area in world coordinates for grid
            const visibleLeft = -editorCameraX / editorCameraZoom;
            const visibleTop = -editorCameraY / editorCameraZoom;
            const visibleRight = (canvas.width - editorCameraX) / editorCameraZoom;
            const visibleBottom = (canvas.height - editorCameraY) / editorCameraZoom;

            // Grid
            ctx.strokeStyle = '#1a1a3a';
            ctx.lineWidth = 1 / editorCameraZoom;
            const gridSize = 50;
            const startX = Math.floor(visibleLeft / gridSize) * gridSize;
            const startY = Math.floor(visibleTop / gridSize) * gridSize;
            for (let x = startX; x < visibleRight; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, visibleTop);
                ctx.lineTo(x, visibleBottom);
                ctx.stroke();
            }
            for (let y = startY; y < visibleBottom; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(visibleLeft, y);
                ctx.lineTo(visibleRight, y);
                ctx.stroke();
            }

            // Floor (infinite in world space)
            ctx.fillStyle = '#2a2a4a';
            ctx.fillRect(visibleLeft - 1000, FLOOR_Y, visibleRight - visibleLeft + 2000, 2000);
            ctx.strokeStyle = '#3a3a5a';
            ctx.lineWidth = 2 / editorCameraZoom;
            ctx.beginPath();
            ctx.moveTo(visibleLeft - 1000, FLOOR_Y);
            ctx.lineTo(visibleRight + 1000, FLOOR_Y);
            ctx.stroke();

            currentLevel.objects.forEach(obj => {
                obj.draw(ctx);

                if (obj === selectedObject) {
                    ctx.strokeStyle = '#00d9ff';
                    ctx.lineWidth = 2 / editorCameraZoom;
                    ctx.setLineDash([5 / editorCameraZoom, 5 / editorCameraZoom]);

                    if (obj.type === 'wall') {
                        ctx.beginPath();
                        ctx.arc(obj.x1, obj.y1, 8 / editorCameraZoom, 0, Math.PI * 2);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.arc(obj.x2, obj.y2, 8 / editorCameraZoom, 0, Math.PI * 2);
                        ctx.stroke();
                    } else {
                        // Draw rotated selection box
                        ctx.save();
                        ctx.translate(obj.x, obj.y);
                        ctx.rotate(obj.rotation * Math.PI / 180);
                        ctx.strokeRect(-obj.width/2 - 5, -obj.height/2 - 5, obj.width + 10, obj.height + 10);
                        ctx.restore();
                    }
                    ctx.setLineDash([]);

                    // Draw resize handles (at rotated corners)
                    if (obj.type !== 'wall') {
                        const handles = getResizeHandles(obj);
                        ctx.fillStyle = '#00d9ff';
                        Object.values(handles).forEach(h => {
                            ctx.beginPath();
                            ctx.arc(h.x, h.y, 5 / editorCameraZoom, 0, Math.PI * 2);
                            ctx.fill();
                        });

                        // Draw rotation handle (always above object, accounting for rotation)
                        const handleDist = Math.max(obj.width, obj.height) / 2 + 30;
                        const rad = obj.rotation * Math.PI / 180;
                        const handleX = obj.x + Math.sin(rad) * handleDist;
                        const handleY = obj.y - Math.cos(rad) * handleDist;

                        ctx.strokeStyle = '#00d9ff';
                        ctx.lineWidth = 2 / editorCameraZoom;
                        ctx.beginPath();
                        const lineStartX = obj.x + Math.sin(rad) * (obj.height/2 + 5);
                        const lineStartY = obj.y - Math.cos(rad) * (obj.height/2 + 5);
                        ctx.moveTo(lineStartX, lineStartY);
                        ctx.lineTo(handleX, handleY);
                        ctx.stroke();

                        ctx.fillStyle = '#ff6b6b';
                        ctx.beginPath();
                        ctx.arc(handleX, handleY, 8 / editorCameraZoom, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            });

            // Draw wall being created
            if (isDrawingWall && wallStartPoint) {
                ctx.strokeStyle = '#dfe6e9';
                ctx.lineWidth = 4 / editorCameraZoom;
                ctx.setLineDash([5 / editorCameraZoom, 5 / editorCameraZoom]);
                ctx.beginPath();
                ctx.moveTo(wallStartPoint.x, wallStartPoint.y);
                ctx.lineTo(lastMouseX, lastMouseY);
                ctx.stroke();
                ctx.setLineDash([]);
            }

            // Draw ball spawn
            ctx.beginPath();
            ctx.arc(currentLevel.ballSpawn.x, currentLevel.ballSpawn.y, 15, 0, Math.PI * 2);
            ctx.fillStyle = selectedObject === 'ballSpawn' ? '#ff8a8a' : '#ff4757';
            ctx.fill();
            ctx.strokeStyle = selectedObject === 'ballSpawn' ? '#00d9ff' : '#cc3344';
            ctx.lineWidth = selectedObject === 'ballSpawn' ? 3 / editorCameraZoom : 2 / editorCameraZoom;
            ctx.stroke();

            ctx.fillStyle = '#fff';
            ctx.font = `${12 / editorCameraZoom}px Arial`;
            ctx.textAlign = 'center';
            ctx.fillText('SPAWN', currentLevel.ballSpawn.x, currentLevel.ballSpawn.y + 30);

            ctx.restore();

            // Draw zoom indicator (UI, not affected by camera)
            if (editorCameraZoom !== 1) {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = '14px Arial';
                ctx.textAlign = 'left';
                ctx.fillText(`Zoom: ${Math.round(editorCameraZoom * 100)}%`, 10, canvas.height - 40);
            }

            // Instructions
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '12px Arial';
            ctx.fillText('Right-click drag to pan | Scroll to zoom (or resize selected)', 10, canvas.height - 20);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
